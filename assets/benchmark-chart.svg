<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title description">
    <title id="title">easy-stack 2.1.0 performance compared with 2.0.0</title>
    <desc id="description">Two grouped bar charts compare 100,000 retained instance constructions and 100,000 scheduled task turns on Node 22.13 and Node 24.18. Version 2.1.0 is about 18 times faster at construction and 1.57 to 2.40 times faster at task-turn scheduling in these captured runs.</desc>
    <rect width="1800" height="900" fill="#020816"/>
    <rect x="34" y="34" width="1732" height="832" rx="28" fill="#061227" stroke="#265879" stroke-width="2"/>
    <text x="86" y="104" fill="#f7fbff" font-family="system-ui, sans-serif" font-size="42" font-weight="700">easy-stack 2.1.0 removes WeakMap overhead</text>
    <text x="86" y="146" fill="#a9bfd4" font-family="system-ui, sans-serif" font-size="24">100,000 operations · median of 21 alternating samples · lower is faster</text>

    <rect x="1180" y="86" width="24" height="24" fill="#ffbd3f"/>
    <text x="1218" y="106" fill="#dceafa" font-family="system-ui, sans-serif" font-size="22">2.0.0 · WeakMap</text>
    <rect x="1482" y="86" width="24" height="24" fill="#4de3f2"/>
    <text x="1520" y="106" fill="#dceafa" font-family="system-ui, sans-serif" font-size="22">2.1.0 · private fields</text>

    <rect x="74" y="190" width="802" height="590" rx="20" fill="#0a1b35" stroke="#1b4568"/>
    <text x="112" y="244" fill="#f7fbff" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Retained instance construction</text>
    <text x="112" y="280" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="20">Milliseconds per 100,000 instances</text>
    <line x1="276" y1="326" x2="826" y2="326" stroke="#34617e"/>
    <line x1="276" y1="326" x2="276" y2="678" stroke="#34617e"/>
    <line x1="459" y1="326" x2="459" y2="678" stroke="#193c58"/>
    <line x1="643" y1="326" x2="643" y2="678" stroke="#193c58"/>
    <line x1="826" y1="326" x2="826" y2="678" stroke="#193c58"/>
    <text x="276" y="710" text-anchor="middle" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="18">0</text>
    <text x="459" y="710" text-anchor="middle" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="18">30</text>
    <text x="643" y="710" text-anchor="middle" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="18">60</text>
    <text x="826" y="710" text-anchor="middle" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="18">90 ms</text>

    <text x="112" y="392" fill="#dceafa" font-family="system-ui, sans-serif" font-size="22">Node 22.13</text>
    <rect x="276" y="354" width="477" height="34" fill="#ffbd3f"/>
    <text x="764" y="379" fill="#ffe4a3" font-family="system-ui, sans-serif" font-size="20">78.05 ms</text>
    <rect x="276" y="402" width="27" height="34" fill="#4de3f2"/>
    <text x="314" y="427" fill="#b0f6ff" font-family="system-ui, sans-serif" font-size="20">4.36 ms · 17.92× faster</text>

    <text x="112" y="548" fill="#dceafa" font-family="system-ui, sans-serif" font-size="22">Node 24.18</text>
    <rect x="276" y="510" width="449" height="34" fill="#ffbd3f"/>
    <text x="736" y="535" fill="#ffe4a3" font-family="system-ui, sans-serif" font-size="20">73.53 ms</text>
    <rect x="276" y="558" width="24" height="34" fill="#4de3f2"/>
    <text x="311" y="583" fill="#b0f6ff" font-family="system-ui, sans-serif" font-size="20">3.97 ms · 18.50× faster</text>

    <rect x="924" y="190" width="802" height="590" rx="20" fill="#0a1b35" stroke="#1b4568"/>
    <text x="962" y="244" fill="#f7fbff" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Schedule and run task turns</text>
    <text x="962" y="280" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="20">Milliseconds per 100,000 task turns</text>
    <line x1="1126" y1="326" x2="1676" y2="326" stroke="#34617e"/>
    <line x1="1126" y1="326" x2="1126" y2="678" stroke="#34617e"/>
    <line x1="1309" y1="326" x2="1309" y2="678" stroke="#193c58"/>
    <line x1="1493" y1="326" x2="1493" y2="678" stroke="#193c58"/>
    <line x1="1676" y1="326" x2="1676" y2="678" stroke="#193c58"/>
    <text x="1126" y="710" text-anchor="middle" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="18">0</text>
    <text x="1309" y="710" text-anchor="middle" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="18">2</text>
    <text x="1493" y="710" text-anchor="middle" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="18">4</text>
    <text x="1676" y="710" text-anchor="middle" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="18">6 ms</text>

    <text x="962" y="392" fill="#dceafa" font-family="system-ui, sans-serif" font-size="22">Node 22.13</text>
    <rect x="1126" y="354" width="534" height="34" fill="#ffbd3f"/>
    <text x="1650" y="379" text-anchor="end" fill="#2b1700" font-family="system-ui, sans-serif" font-size="20" font-weight="700">5.83 ms</text>
    <rect x="1126" y="402" width="223" height="34" fill="#4de3f2"/>
    <text x="1360" y="427" fill="#b0f6ff" font-family="system-ui, sans-serif" font-size="20">2.43 ms · 2.40× faster</text>

    <text x="962" y="548" fill="#dceafa" font-family="system-ui, sans-serif" font-size="22">Node 24.18</text>
    <rect x="1126" y="510" width="413" height="34" fill="#ffbd3f"/>
    <text x="1529" y="535" text-anchor="end" fill="#2b1700" font-family="system-ui, sans-serif" font-size="20" font-weight="700">4.51 ms</text>
    <rect x="1126" y="558" width="264" height="34" fill="#4de3f2"/>
    <text x="1401" y="583" fill="#b0f6ff" font-family="system-ui, sans-serif" font-size="20">2.88 ms · 1.57× faster</text>

    <text x="900" y="834" text-anchor="middle" fill="#8da4bb" font-family="system-ui, sans-serif" font-size="19">Exact 2.0.0 tag vs 2.1.0 · Intel Core Ultra 9 275HX · Windows x64 · validated checksums</text>
</svg>
