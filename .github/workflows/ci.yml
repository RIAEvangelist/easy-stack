name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - '22.12.0'
          - '24'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit suite
        run: npm run test:unit

      - name: Run Functional suite
        run: npm run test:functional

      - name: Run Integration suite
        run: npm run test:integration

      - name: Run Regression suite
        run: npm run test:regression

      - name: Preview the packed package
        run: npm pack --dry-run

  compatibility:
    name: Runtime floor / Node 12.22.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up exact Node.js runtime floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '12.22.12'

      - name: Run dependency-free behavior and package contracts
        env:
          EASY_STACK_TEST_LEGACY: '1'
        run: node ./scripts/test.js legacy

      - name: Exercise the CommonJS entry
        run: node --eval "const Stack=require('./stack.cjs'); const stack=new Stack(); stack.add(function(){ this.next(); }); if (stack.running || stack.size) process.exitCode=1;"

  coverage:
    name: Native V8 coverage / Node 24 + Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Google Chrome Stable
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      - name: Verify the unique test catalog
        run: node ./scripts/test-catalog.js --github-summary

      - name: Run Node and Chrome coverage
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          VANILLA_TEST_CHROME_NO_SANDBOX: '1'
        run: npm run coverage -- --chrome-path "$CHROME_PATH"

      - name: Run real-Chrome Regression cases
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          VANILLA_TEST_CHROME_NO_SANDBOX: '1'
        run: npm run test:regression:chrome

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-v8-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  package-smoke:
    name: Packed npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack, inspect, install, and import the artifact
        shell: bash
        run: |
          TARBALL="$(npm pack --silent)"
          TARBALL_PATH="$GITHUB_WORKSPACE/$TARBALL"
          PACK_FILE_LIST="$RUNNER_TEMP/easy-stack-pack-files.txt"
          EXPECTED_VERSION="$(node --print "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          test -f "$TARBALL_PATH"
          tar -tf "$TARBALL_PATH" > "$PACK_FILE_LIST"
          for REQUIRED_FILE in \
            package/package.json \
            package/README.md \
            package/stack.js \
            package/stack.cjs \
            package/stack-vanilla.js \
            package/es5.js \
            package/CHANGELOG.md \
            package/MIGRATION.md \
            package/licence
          do
            grep --fixed-strings --line-regexp --quiet -- "$REQUIRED_FILE" "$PACK_FILE_LIST"
          done

          if grep --extended-regexp --quiet '^package/(assets|coverage|example|playground|scripts|test|\.github)/' "$PACK_FILE_LIST"; then
            echo "Packed artifact contains repository-only files."
            grep --extended-regexp '^package/(assets|coverage|example|playground|scripts|test|\.github)/' "$PACK_FILE_LIST"
            exit 1
          fi

          SMOKE_DIRECTORY="$RUNNER_TEMP/easy-stack-package-smoke"
          mkdir -p "$SMOKE_DIRECTORY"
          cd "$SMOKE_DIRECTORY"
          npm init --yes >/dev/null
          npm install "$TARBALL_PATH" --ignore-scripts
          EXPECTED_VERSION="$EXPECTED_VERSION" node --input-type=module --eval "import fs from 'node:fs'; import Stack, { Stack as NamedStack } from 'easy-stack'; const manifest=JSON.parse(fs.readFileSync('./node_modules/easy-stack/package.json','utf8')); const order=[]; const stack=new Stack(); stack.add(function(){ order.push('bottom'); this.next(); },function(){ order.push('top'); this.next(); }); if (Stack !== NamedStack || order.join(',') !== 'top,bottom' || manifest.version !== process.env.EXPECTED_VERSION) process.exitCode=1;"
          node --eval "const Stack=require('easy-stack'); if (Stack !== Stack.Stack || new Stack().size !== 0) process.exitCode=1;"

      - name: Upload packed npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packed-npm-artifact
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 14
